            question: "Cuando te enfrentas a un sistema heredado (código legado) que NO tiene tests, ¿qué técnica de emergencia se aconseja para capturar el comportamiento actual antes de tocar nada?",
            options: [
                { text: "A) Pruebas de caracterización (Characterization tests) o enfoques de Golden Master / Approval Testing.", isCorrect: true, rationale: "Capturan la salida actual ante un grupo de entradas para usarla de referencia fija y detectar regresiones no deseadas[cite: 3]." },
                { text: "B) Pasar las reglas estáticas de Checkstyle de manera destructiva.", isCorrect: false, rationale: "Checkstyle solo mira formato y estilo tipográfico, no valida el comportamiento lógico del software[cite: 3]." },
                { text: "C) Borrar los métodos privados sospechosos mediante Safe Delete.", isCorrect: false, rationale: "Sin tests, borrar código a ciegas es altamente peligroso y destructivo[cite: 3]." },
                { text: "D) Reescribir la clase entera usando herencia rechazada.", isCorrect: false, rationale: "La herencia rechazada es un code smell que degrada la arquitectura, no una técnica de pruebas[cite: 3]." }
            ],
            hint: "Consiste en guardar una 'fotografía' de los resultados actuales del sistema para comparar si cambia tras refactorizar[cite: 3]."
        },
        {
            question: "¿Qué mide concretamente la métrica de 'Complejidad Ciclomática'?",
            options: [
                { text: "A) El número total de clases que heredan de una superclase abstracta en UML.", isCorrect: false, rationale: "Eso mediría la profundidad del árbol de herencia, no la complejidad ciclomática." },
                { text: "B) El porcentaje de código duplicado entre los archivos del repositorio.", isCorrect: false, rationale: "Eso corresponde a la métrica de porcentaje de duplicación[cite: 3]." },
                { text: "C) El número de caminos lógicos independientes en el código (ramas de ifs, bucles, etc.).", isCorrect: true, rationale: "Indica cuántos caminos puede seguir el flujo de ejecución; una reducción significa código más simple y testeable[cite: 3]." },
                { text: "D) La cantidad de commits pequeños realizados en una rama dedicada.", isCorrect: false, rationale: "Eso mide la frecuencia o patrón de control de versiones del equipo, no una métrica del código[cite: 3]." }
            ],
            hint: "Se incrementa cada vez que añades estructuras de control como condicionales 'if' o bucles iterativos[cite: 3]."
        },
        {
            question: "Herramientas como 'PMD', 'Checkstyle' o 'SonarQube' se clasifican en los apuntes como:",
            options: [
                { text: "A) Frameworks para automatizar pruebas unitarias de caja negra.", isCorrect: false, rationale: "Las pruebas unitarias emplean herramientas como JUnit, no estos analizadores." },
                { text: "B) Motores de bases de datos embebidas para proyectos de desarrollo en Java.", isCorrect: false, rationale: "No proveen almacenamiento de persistencia relacional." },
                { text: "C) Herramientas de análisis estático para detectar deuda técnica, code smells y problemas de estilo de código.", isCorrect: true, rationale: "Revisan el código fuente sin ejecutarlo para buscar oportunidades de mejora y verificar convenciones de equipo[cite: 3, 3]." },
                { text: "D) Compiladores optimizados integrados en el pipeline CI/CD de Atlassian.", isCorrect: false, rationale: "No compilan código; analizan el texto fuente para auditar su calidad de diseño[cite: 3]." }
            ],
            hint: "Inspeccionan los archivos de código en frío (sin ejecutar el programa) buscando fallos y malas prácticas[cite: 3]."
        }
    ];

    let currentScore = 0;
    let questionsAnswered = 0;

    function renderQuiz() {
        const container = document.getElementById('quiz-container');
        if (!container) return;
        container.innerHTML = '';

        quizData.forEach((q, qIndex) => {
            const card = document.createElement('div');
            card.className = 'question-card';
            card.id = 'q-card-' + qIndex;

            const qText = document.createElement('p');
            qText.className = 'question-text';
            qText.innerText = (qIndex + 1) + '. ' + q.question;
            card.appendChild(qText);

            const hintBtn = document.createElement('button');
            hintBtn.className = 'hint-btn';
            hintBtn.innerText = 'Ver pista';
            hintBtn.onclick = function() { toggleHint(qIndex); };
            card.appendChild(hintBtn);

            const hintT = document.createElement('div');
            hintT.className = 'hint-text';
            hintT.id = 'hint-' + qIndex;
            hintT.innerText = q.hint;
            card.appendChild(hintT);

            const optionsUl = document.createElement('ul');
            optionsUl.className = 'options-list';

            q.options.forEach((opt, oIndex) => {
                const li = document.createElement('li');
                li.className = 'option-item';
                li.innerText = opt.text;
                li.onclick = function() { checkAnswer(qIndex, oIndex, li); };
                optionsUl.appendChild(li);
            });

            card.appendChild(optionsUl);

            const rationaleDiv = document.createElement('div');
            rationaleDiv.className = 'rationale-text';
            rationaleDiv.id = 'rationale-' + qIndex;
            card.appendChild(rationaleDiv);

            container.appendChild(card);
        });
        
        updateScoreboard();
    }

    function toggleHint(index) {
        const hintElement = document.getElementById('hint-' + index);
        if (!hintElement) return;
        if (hintElement.style.display === 'block') {
            hintElement.style.display = 'none';
        } else {
            hintElement.style.display = 'block';
        }
    }

    function checkAnswer(qIndex, oIndex, selectedLi) {
        const card = document.getElementById('q-card-' + qIndex);
        if (!card || card.className.indexOf('answered') !== -1) return;

        const question = quizData[qIndex];
        const optionSelected = question.options[oIndex];
        const rationaleDiv = document.getElementById('rationale-' + qIndex);

        card.className += ' answered';
        questionsAnswered++;

        const items = card.querySelectorAll('.option-item');
        items.forEach((item) => {
            item.className += ' disabled';
        });

        if (optionSelected.isCorrect) {
            selectedLi.className += ' selected-correct';
            currentScore++;
            rationaleDiv.innerHTML = '<strong>¡Correcto!</strong> ' + optionSelected.rationale;
            rationaleDiv.style.borderLeftColor = 'var(--correct-color)';
        } else {
            selectedLi.className += ' selected-incorrect';
            rationaleDiv.innerHTML = '<strong>Incorrecto.</strong> ' + optionSelected.rationale;
            rationaleDiv.style.borderLeftColor = 'var(--incorrect-color)';

            items.forEach((item, idx) => {
                if (question.options[idx].isCorrect) {
                    item.className += ' selected-correct';
                }
            });
        }

        updateScoreboard();
    }

    function updateScoreboard() {
        document.getElementById('progress').innerText = 'Progreso: ' + questionsAnswered + ' / ' + quizData.length + ' preguntas';
        const percent = Math.round((currentScore / quizData.length) * 100);
        document.getElementById('score').innerText = 'Puntuación: ' + percent + '% (' + currentScore + ' aciertos)';
    }

    window.onload = renderQuiz;
</script>
</body>
