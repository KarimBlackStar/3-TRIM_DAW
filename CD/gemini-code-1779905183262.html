    ];

    let currentScore = 0;
    let questionsAnswered = 0;

    function renderQuiz() {
        const container = document.getElementById('quiz-container');
        if (!container) return;
        container.innerHTML = '';

        quizData.forEach((q, qIndex) => {
            const card = document.createElement('div');
            card.className = 'question-card';
            card.id = 'q-card-' + qIndex;

            const qText = document.createElement('p');
            qText.className = 'question-text';
            qText.innerText = (qIndex + 1) + '. ' + q.question;
            card.appendChild(qText);

            const hintBtn = document.createElement('button');
            hintBtn.className = 'hint-btn';
            hintBtn.innerText = 'Ver pista';
            hintBtn.onclick = function() { toggleHint(qIndex); };
            card.appendChild(hintBtn);

            const hintT = document.createElement('div');
            hintT.className = 'hint-text';
            hintT.id = 'hint-' + qIndex;
            hintT.innerText = q.hint;
            card.appendChild(hintT);

            const optionsUl = document.createElement('ul');
            optionsUl.className = 'options-list';

            q.options.forEach((opt, oIndex) => {
                const li = document.createElement('li');
                li.className = 'option-item';
                li.innerText = opt.text;
                li.onclick = function() { checkAnswer(qIndex, oIndex, li); };
                optionsUl.appendChild(li);
            });

            card.appendChild(optionsUl);

            const rationaleDiv = document.createElement('div');
            rationaleDiv.className = 'rationale-text';
            rationaleDiv.id = 'rationale-' + qIndex;
            card.appendChild(rationaleDiv);

            container.appendChild(card);
        });
        
        updateScoreboard();
    }

    function toggleHint(index) {
        const hintElement = document.getElementById('hint-' + index);
        if (!hintElement) return;
        if (hintElement.style.display === 'block') {
            hintElement.style.display = 'none';
        } else {
            hintElement.style.display = 'block';
        }
    }

    function checkAnswer(qIndex, oIndex, selectedLi) {
        const card = document.getElementById('q-card-' + qIndex);
        if (!card || card.className.indexOf('answered') !== -1) return;

        const question = quizData[qIndex];
        const optionSelected = question.options[oIndex];
        const rationaleDiv = document.getElementById('rationale-' + qIndex);

        card.className += ' answered';
        questionsAnswered++;

        const items = card.querySelectorAll('.option-item');
        items.forEach((item) => {
            item.className += ' disabled';
        });

        if (optionSelected.isCorrect) {
            selectedLi.className += ' selected-correct';
            currentScore++;
            rationaleDiv.innerHTML = '<strong>¡Correcto!</strong> ' + optionSelected.rationale;
            rationaleDiv.style.borderLeftColor = 'var(--correct-color)';
        } else {
            selectedLi.className += ' selected-incorrect';
            rationaleDiv.innerHTML = '<strong>Incorrecto.</strong> ' + optionSelected.rationale;
            rationaleDiv.style.borderLeftColor = 'var(--incorrect-color)';

            items.forEach((item, idx) => {
                if (question.options[idx].isCorrect) {
                    item.className += ' selected-correct';
                }
            });
        }

        updateScoreboard();
    }

    function updateScoreboard() {
        document.getElementById('progress').innerText = 'Progreso: ' + questionsAnswered + ' / ' + quizData.length + ' preguntas';
        const percent = Math.round((currentScore / quizData.length) * 100);
        document.getElementById('score').innerText = 'Puntuación: ' + percent + '% (' + currentScore + ' aciertos)';
    }

    window.onload = renderQuiz;
</script>
