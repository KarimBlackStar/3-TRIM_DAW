                { text: "B) Es un formato de texto plano que permite estructurar documentos de forma sencilla y legible, usado en GitHub.", isCorrect: true, rationale: "Exacto. Permite añadir negritas, listas y enlaces escribiendo en texto plano de forma muy limpia." },
                { text: "C) Es una extensión que automatiza la compilación de proyectos Java Ant.", isCorrect: false, rationale: "Markdown es para formatear texto, no tiene relación con compilar clases de Java." },
                { text: "D) Es la plataforma en la nube de Atlassian para gestionar bases de datos SQL relacionales.", isCorrect: false, rationale: "No almacena datos estructurados ni es de Atlassian; Confluence y Jira sí son de Atlassian." }
            ],
            hint: "Es el formato estándar por excelencia de los archivos README de los repositorios de desarrollo."
        },
        {
            question: "Plataformas como 'Confluence', 'Redmine' o 'Jira' se definen globalmente como:",
            options: [
                { text: "A) Compiladores nativos incluidos por defecto en el JDK de Java.", isCorrect: false, rationale: "El JDK incluye herramientas como javac o javadoc, no estas plataformas web." },
                { text: "B) Formatos de texto plano idénticos al estándar AsciiDoc.", isCorrect: false, rationale: "AsciiDoc es un lenguaje de marcado ligero, no una plataforma o software de gestión." },
                { text: "C) Herramientas y plataformas para la gestión de proyectos de software y documentación colaborativa.", isCorrect: true, rationale: "Permiten estructurar tareas, historias de usuario, wikis y documentación interna del equipo de desarrollo." },
                { text: "D) Sistemas operativos de red específicos para servidores Linux corporativos.", isCorrect: false, rationale: "Son aplicaciones web de gestión, no sistemas operativos." }
            ],
            hint: "Ayudan al equipo a coordinar tareas, documentar en formato wiki y realizar el seguimiento del desarrollo."
        }
    ];

    let currentScore = 0;
    let questionsAnswered = 0;

    function renderQuiz() {
        const container = document.getElementById('quiz-container');
        if (!container) return;
        container.innerHTML = '';

        quizData.forEach((q, qIndex) => {
            const card = document.createElement('div');
            card.className = 'question-card';
            card.id = 'q-card-' + qIndex;

            const qText = document.createElement('p');
            qText.className = 'question-text';
            qText.innerText = (qIndex + 1) + '. ' + q.question;
            card.appendChild(qText);

            const hintBtn = document.createElement('button');
            hintBtn.className = 'hint-btn';
            hintBtn.innerText = 'Ver pista';
            hintBtn.onclick = function() { toggleHint(qIndex); };
            card.appendChild(hintBtn);

            const hintT = document.createElement('div');
            hintT.className = 'hint-text';
            hintT.id = 'hint-' + qIndex;
            hintT.innerText = q.hint;
            card.appendChild(hintT);

            const optionsUl = document.createElement('ul');
            optionsUl.className = 'options-list';

            q.options.forEach((opt, oIndex) => {
                const li = document.createElement('li');
                li.className = 'option-item';
                li.innerText = opt.text;
                li.onclick = function() { checkAnswer(qIndex, oIndex, li); };
                optionsUl.appendChild(li);
            });

            card.appendChild(optionsUl);

            const rationaleDiv = document.createElement('div');
            rationaleDiv.className = 'rationale-text';
            rationaleDiv.id = 'rationale-' + qIndex;
            card.appendChild(rationaleDiv);

            container.appendChild(card);
        });
        
        updateScoreboard();
    }

    function toggleHint(index) {
        const hintElement = document.getElementById('hint-' + index);
        if (!hintElement) return;
        if (hintElement.style.display === 'block') {
            hintElement.style.display = 'none';
        } else {
            hintElement.style.display = 'block';
        }
    }

    function checkAnswer(qIndex, oIndex, selectedLi) {
        const card = document.getElementById('q-card-' + qIndex);
        if (!card || card.className.indexOf('answered') !== -1) return;

        const question = quizData[qIndex];
        const optionSelected = question.options[oIndex];
        const rationaleDiv = document.getElementById('rationale-' + qIndex);

        card.className += ' answered';
        questionsAnswered++;

        const items = card.querySelectorAll('.option-item');
        items.forEach((item) => {
            item.className += ' disabled';
        });

        if (optionSelected.isCorrect) {
            selectedLi.className += ' selected-correct';
            currentScore++;
            rationaleDiv.innerHTML = '<strong>¡Correcto!</strong> ' + optionSelected.rationale;
            rationaleDiv.style.borderLeftColor = 'var(--correct-color)';
        } else {
            selectedLi.className += ' selected-incorrect';
            rationaleDiv.innerHTML = '<strong>Incorrecto.</strong> ' + optionSelected.rationale;
            rationaleDiv.style.borderLeftColor = 'var(--incorrect-color)';

            items.forEach((item, idx) => {
                if (question.options[idx].isCorrect) {
                    item.className += ' selected-correct';
                }
            });
        }

        updateScoreboard();
    }

    function updateScoreboard() {
        document.getElementById('progress').innerText = 'Progreso: ' + questionsAnswered + ' / ' + quizData.length + ' preguntas';
        const percent = Math.round((currentScore / quizData.length) * 100);
        document.getElementById('score').innerText = 'Puntuación: ' + percent + '% (' + currentScore + ' aciertos)';
    }

    window.onload = renderQuiz;
</script>
</body>
</html>
